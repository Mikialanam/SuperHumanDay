<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trailkin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one phone-width column — trainer card, daily quests, area tabs (Body/Health/Growth/Work) driving the log pad and medals, recent log */
:root{
  --bg:#E8F0EC; --panel:#FFFFFF; --ink:#16302A; --muted:#5D746C; --line:#CFDDD6;
  --accent:#FF6A3D; --accent-ink:#FFFFFF; --leaf:#2E9E6A; --sun:#F5B931; --sky:#3C8DDB;
  --soft:#F3F8F5;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1D19; --panel:#172A24; --ink:#E6F2EC; --muted:#93AEA4; --line:#2A4239;
  --accent:#FF7A50; --accent-ink:#1A0E08; --leaf:#45C487; --sun:#F7C64E; --sky:#62A9EE; --soft:#1C332C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D19; --panel:#172A24; --ink:#E6F2EC; --muted:#93AEA4; --line:#2A4239;
  --accent:#FF7A50; --accent-ink:#1A0E08; --leaf:#45C487; --sun:#F7C64E; --sky:#62A9EE; --soft:#1C332C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:600}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
/* trainer card */
.card{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.card .lvl{width:74px;height:74px;border-radius:50%;background:var(--sun);color:#16302A;display:grid;place-items:center;font-family:var(--display);font-weight:700;line-height:1;text-align:center}
.card .lvl b{font-size:1.9rem;display:block}.card .lvl small{font-size:.65rem;letter-spacing:.1em}
.card h1{font-size:1.5rem}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:12px;padding:8px 10px}
.stat b{font-family:var(--display);font-size:1.3rem;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;opacity:.8}
/* quests */
.quest{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--accent-ink)}
.quest.done .check{background:var(--leaf);border-color:var(--leaf);color:#fff}
.quest.done .qt{text-decoration:line-through;color:var(--muted)}
.xp{font-family:var(--display);font-size:.85rem;color:var(--accent);font-variant-numeric:tabular-nums}
.bonus{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
/* quick log */
.pad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{font:inherit;font-weight:800;border:none;border-radius:14px;padding:14px 10px;cursor:pointer;background:var(--soft);color:var(--ink);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn small{font-weight:600;color:var(--muted);font-size:.75rem}
.btn.hero{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-size:1.25rem;font-weight:600;align-items:center}
.btn.hero small{color:inherit;opacity:.85}
.btn:focus-visible,.mini:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.counter{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:6px}
.mini{font:inherit;font-weight:800;width:38px;height:38px;border-radius:10px;border:none;background:var(--panel);color:var(--ink);cursor:pointer;border:1px solid var(--line)}
.counter b{font-family:var(--display);min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
input[type=number]{font:inherit;width:110px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.ghost{font:inherit;font-weight:700;background:none;border:none;color:var(--sky);cursor:pointer;padding:6px 0}
/* medals */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.medal{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}
.disc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem;background:var(--line);color:var(--muted);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.t1 .disc{background:#C8834A;color:#fff}.t2 .disc{background:#A9B6BE;color:#16302A}.t3 .disc{background:#F2C12E;color:#16302A}.t4 .disc{background:linear-gradient(135deg,#BFE7F2,#7FC2E0 50%,#D7C6F5);color:#16302A}
.mtext{display:flex;flex-direction:column;gap:3px;min-width:0}
.mtext b{font-family:var(--display);font-weight:600}
.mtext span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.mbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.log{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.log div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:800;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--muted)}
.day.hit{background:var(--leaf);border-color:var(--leaf);color:#fff}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.note{font-size:.78rem;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{font:inherit;font-family:var(--display);font-weight:600;border:none;border-radius:11px;padding:10px 4px;background:none;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn.on{background:var(--leaf);border-color:var(--leaf);color:#fff}.btn.on small{color:#fff;opacity:.9}
.btn.add{border-style:dashed;background:none;color:var(--sky);justify-content:center;align-items:center}
.inputs{display:flex;flex-wrap:wrap;gap:14px}
.inputs > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.weight{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.weight div{background:var(--soft);border-radius:12px;padding:8px}
.weight b{font-family:var(--display);font-size:1.15rem;display:block;font-variant-numeric:tabular-nums}
.weight span{font-size:.7rem;color:var(--muted)}
form.new{display:grid;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
form.new label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:800;color:var(--muted)}
form.new input,form.new select{font:inherit;font-weight:600;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.solid{font:inherit;font-weight:800;border:none;border-radius:12px;padding:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.mine{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.x{font:inherit;background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);padding:4px 8px;cursor:pointer}
.x.sure{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.medal small{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.plan{display:flex;flex-direction:column;gap:14px}
.phase{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.phase .label{color:inherit;opacity:.75}
.phase b{font-family:var(--display);font-size:1.2rem;font-weight:600}
.phase ul,.plan ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-block:7px}
.trow:last-child{border-bottom:none}
.trow b{font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:600;text-align:right}
.trow b.ok{color:var(--leaf)}
.sub{font-family:var(--display);font-weight:600;font-size:1rem;margin:0}
.ckpt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.ckpt time{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.gbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.gbar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
/* trends & stepped goal */
.pick{font:inherit;font-weight:800;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-width:0;max-width:55%}
.pick:focus-visible,.seg button:focus-visible,.nav button:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.goal{display:flex;flex-direction:column;gap:10px}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gtile{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gtile b{font-family:var(--display);font-size:1.55rem;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.gtile b small{font-size:.85rem;color:var(--muted);font-weight:500}
.gtile .note{line-height:1.3}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.prow b{font-family:var(--display);font-weight:600}
.prow .note{grid-column:1/-1}
.prow > span:first-child .note{display:block}
.pill{font-size:.78rem;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--leaf);color:var(--panel)}
.pill.close{background:var(--sun);color:#16302A}
.pill.behind{background:var(--accent);color:var(--accent-ink)}
.pill.wait{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
details.lad summary{cursor:pointer;font-weight:800;color:var(--sky);padding:4px 0;list-style-position:inside}
.ltab{display:grid;grid-template-columns:auto 1fr 1fr;gap:0 12px;font-size:.88rem;font-variant-numeric:tabular-nums;margin-top:6px}
.ltab > *{padding:5px 0;border-bottom:1px solid var(--line)}
.ltab b{font-family:var(--display);font-weight:600}
.ltab .past{color:var(--muted)}
.ltab .cur{color:var(--accent);font-weight:800}
.gempty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#goalform .two{align-items:end}
.chart{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{font:inherit;font-weight:800;font-size:.85rem;border:none;border-radius:8px;padding:6px 4px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.readout{display:flex;flex-direction:column;min-width:0;min-height:68px;justify-content:flex-end}
.readout b{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.readout b small{font-size:.9rem;color:var(--muted);font-weight:500}
.nav{display:flex;gap:6px;flex:none}
.nav button{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.chart svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .ytick{fill:var(--muted);font-size:11px;text-anchor:end;font-variant-numeric:tabular-nums}
.chart .xtick{fill:var(--muted);font-size:11px;text-anchor:middle;font-weight:600}
.chart .xtick.now{fill:var(--ink);font-weight:800}
.chart .barm{fill:var(--accent);transition:opacity .15s}
.chart .barm.dim{opacity:.35}
.chart .tline{fill:none;stroke:var(--leaf);stroke-width:2;stroke-linejoin:round}
.chart .aline{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
.chart .star{fill:var(--sun);stroke:var(--ink);stroke-width:.6;paint-order:stroke;font-size:15px;text-anchor:middle}
.chart .hit{fill:transparent;cursor:pointer;outline:none}
.chart .hit:focus-visible{fill:color-mix(in srgb,var(--sky) 15%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0}
.lg-a{border-top:2px dashed var(--ink);opacity:.75}
.lg-t{border-top:2px solid var(--leaf)}
.star-k{color:var(--sun);-webkit-text-stroke:.5px var(--ink);font-size:1rem}
.glinks{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
</style>

<div class="wrap">
  <section class="card" aria-label="Trainer card">
    <div class="lvl"><div><small>LEVEL</small><b id="lvl">1</b></div></div>
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <h1 id="rank">Trail Rookie</h1>
      <div class="bar"><i id="xpbar" style="width:0%"></i></div>
      <div style="font-size:.8rem;opacity:.85" id="xptext">0 / 100 XP to level 2</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="streak">0</b><span>day streak 🔥</span></div>
      <div class="stat"><b id="todayxp">0</b><span>XP today</span></div>
      <div class="stat"><b id="caught">0</b><span>medal tiers</span></div>
    </div>
  </section>

  <section class="panel" aria-labelledby="qh">
    <div class="row" style="justify-content:space-between"><h2 id="qh">Today's quests</h2><span class="label" id="todaylbl"></span></div>
    <div id="quests"></div>
    <div class="bonus" id="bonus"></div>
  </section>

  <nav class="tabs" aria-label="Goal areas" id="tabs"></nav>

  <section class="panel" aria-labelledby="lh">
    <div class="row" style="justify-content:space-between"><h2 id="lh">Log it</h2><button class="ghost" id="undo">Undo last</button></div>
    <div id="extra"></div>
    <div class="pad" id="pad"></div>
    <div id="formbox" hidden></div>
    <div id="mine"></div>
  </section>

  <section class="panel" aria-labelledby="th" id="trendpanel">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2 id="th">Trends &amp; goal</h2><select id="trendsel" class="pick" aria-label="Exercise to show"></select></div>
    <div id="goalbox" class="goal"></div>
    <div id="goalform" hidden></div>
    <div id="chartbox" class="chart"></div>
  </section>

  <section class="panel" aria-labelledby="dh" id="medalpanel">
    <div class="row" style="justify-content:space-between"><h2 id="dh">Medals</h2><span class="label" id="dexcount"></span></div>
    <div class="dex" id="dex"></div>
  </section>

  <section class="panel" aria-labelledby="wh">
    <h2 id="wh">Burpee streak</h2>
    <div class="week" id="week"></div>
    <span class="note">A day counts when you log at least 5 burpees. Never miss two in a row.</span>
  </section>

  <section class="panel" aria-labelledby="rh">
    <h2 id="rh">Today's log</h2>
    <div class="log" id="log"></div>
    <span class="note" id="savenote">Saved on this device.</span>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const AREAS=["Body","Health","Growth","Work","Plan"];
const PLAN_START="2026-10-28",START_KG=86,GOAL_KG=75;
// kind: count (tap adds step), check (once a day), input (set a number), weight
const BUILTIN=[
 {id:"burpees",a:"Body",name:"Burpees",kind:"count",step:5,unit:"burpees",xp:2,hero:true,medal:"Burpee Machine",g:[50,250,750,2000]},
 {id:"squats",a:"Body",name:"Squats",kind:"count",step:10,unit:"squats",xp:1,medal:"Squat Squad",g:[100,500,1500,4000]},
 {id:"hang",a:"Body",name:"Dead hang",kind:"count",step:20,unit:"s",xp:.4,medal:"Iron Grip",g:[120,600,1800,3600],div:60,du:"min hanging"},
 {id:"horse",a:"Body",name:"Horse stance",kind:"count",step:30,unit:"s",xp:.2,medal:"Rooted",g:[300,1200,3600,7200],div:60,du:"min in stance"},
 {id:"negatives",a:"Body",name:"Pull-up negatives",kind:"count",step:3,unit:"negatives",xp:5,medal:"Slow Lowerer",g:[15,60,200,500]},
 {id:"pullups",a:"Body",name:"Real pull-up",kind:"count",step:1,unit:"pull-up",xp:25,medal:"Pull-up Pro",g:[1,10,50,200]},
 {id:"tilt",a:"Body",name:"Tilt routine",kind:"check",xp:30,medal:"Straight Spine",g:[5,20,50,100],du:"routines"},
 {id:"lift",a:"Body",name:"Lifting session",kind:"check",xp:60,medal:"Bar Lifter",g:[4,12,36,100],du:"sessions"},
 {id:"steps",a:"Health",name:"Steps today",kind:"input",unit:"steps",medal:"Trailblazer",g:[50000,250000,1000000,3000000]},
 {id:"weight",a:"Health",name:"Weigh-in",kind:"weight",unit:"kg",medal:"Lighter Load",g:[2,5,8,12],du:"kg lost"},
 {id:"keto",a:"Health",name:"Keto day",kind:"check",xp:15,medal:"Keto Keeper",g:[7,30,60,120],du:"days"},
 {id:"protein",a:"Health",name:"Hit 140 g protein",kind:"check",xp:20,medal:"Protein Pro",g:[5,20,60,150],du:"days"},
 {id:"meals",a:"Health",name:"2 solid meals",kind:"check",xp:15,medal:"Steady Fuel",g:[5,20,60,150],du:"days"},
 {id:"mealwalk",a:"Health",name:"Walk after a meal",kind:"count",step:1,unit:"walk",xp:8,medal:"Settle Stroller",g:[5,25,75,200],du:"walks"},
 {id:"reading",a:"Growth",name:"Reading",kind:"count",step:10,unit:"min",xp:1,medal:"Bookworm",g:[120,600,1800,6000],div:60,du:"hours read"},
 {id:"learning",a:"Growth",name:"Learning",kind:"count",step:15,unit:"min",xp:1,medal:"Lifelong Learner",g:[120,600,1800,6000],div:60,du:"hours learning"},

  let tp="",prev=null;B.forEach((x,i)=>{const x0=f1(pl+slot*i),x1=f1(pl+slot*(i+1));if(x.t==null){prev=null;return}const yy=f1(y(x.t));tp+=(prev==null?`M${x0},${yy}`:`L${x0},${yy}`)+`H${x1}`;prev=x.t});
  if(tp)s+=`<path d="${tp}" class="tline"/>`;
  if(avg>0)s+=`<line x1="${pl}" x2="${pl+pw}" y1="${f1(y(avg))}" y2="${f1(y(avg))}" class="aline"/>`;
  B.forEach((x,i)=>{s+=`<rect x="${f1(pl+slot*i)}" y="0" width="${f1(slot)}" height="${H}" class="hit" data-bar="${i}" tabindex="0" role="button" aria-label="${esc(x.full)}: ${x.v==null?"no data yet":r0(x.v)+" "+u}${x.t?`, target ${r0(x.t)}`:""}${x.star?", new best":""}"/>`});
  const per=tview==="W"?"Daily":tview==="M"?"Weekly":"Monthly",sel=tbar!=null?B[tbar]:null;
  const read=sel?`<span class="label">${esc(sel.full)}</span><b>${sel.v==null?"–":r0(sel.v)}<small> ${u}</small></b><span class="note">${sel.t?`Target ${r0(sel.t)}${sel.v!=null?(sel.v>=sel.t?" · hit ✓":` · ${r0(sel.t-sel.v)} short`):""}`:"No target set"}${sel.star?" · ★ new best":""}</span>`
    :`<span class="label">${per} average</span><b>${r0(avg)}<small> ${u}</small></b><span class="note">${esc(title)}</span>`;
  const hasT=B.some(x=>x.t!=null),hasS=B.some(x=>x.star);
  box.innerHTML=`<div class="seg" role="group" aria-label="Time range">${[["W","Week"],["M","Month"],["Y","Year"]].map(([v,l])=>`<button type="button" data-view="${v}" aria-pressed="${tview===v}">${l}</button>`).join("")}</div>
  <div class="rhead"><div class="readout">${read}</div><div class="nav"><button type="button" data-nav="1" aria-label="Previous ${per==="Daily"?"week":per==="Weekly"?"month":"year"}">${CHEV("M10 3 5 8l5 5")}</button><button type="button" data-nav="-1" aria-label="Next ${per==="Daily"?"week":per==="Weekly"?"month":"year"}" ${toff?"":"disabled"}>${CHEV("M6 3l5 5-5 5")}</button></div></div>
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(g.name)}, ${per.toLowerCase()} totals for ${esc(title)}. Average ${r0(avg)}.">${s}</svg>
  <div class="legend"><span><i class="lg-a"></i>Average</span>${hasT?`<span><i class="lg-t"></i>Target</span>`:""}${hasS?`<span><b class="star-k">★</b>New best</span>`:""}</div>`;
}

function openGoalForm(g){
  goalFormOpen=true;goalDelSure=false;const f=$("goalform"),tk=today(),t=targets[g.id];
  let d=t;
  if(!d){let a=0,n=0;for(let i=1;i<=7;i++){const k=addDays(tk,-i);if(days[k]){a+=days[k][g.id]||0;n++}}
    const st=Math.max(g.step||1,Math.round((n?a/n:(g.step||1)*5)/(g.step||1))*(g.step||1));
    d={start:st,final:st*2,step:Math.max(1,Math.round(st/5)),from:tk,by:addDays(tk,120),stretch:""}}
  f.dataset.g=g.id;f.hidden=false;$("goalbox").hidden=true;
  f.innerHTML=`<form class="new" id="goalf" novalidate><b style="font-family:var(--display)">${t?"Edit":"New"} stepped goal · ${esc(g.name)}</b>
  <div class="two"><label for="gf-start">Start target / day<input id="gf-start" type="number" min="1" inputmode="numeric" value="${d.start}"></label>
  <label for="gf-final">Final target / day<input id="gf-final" type="number" min="2" inputmode="numeric" value="${d.final}"></label></div>
  <div class="two"><label for="gf-step">Raise by at each step<input id="gf-step" type="number" min="1" inputmode="numeric" value="${d.step}"></label>
  <label for="gf-from">Start date<input id="gf-from" type="date" value="${d.from}"></label></div>
  <div class="two"><label for="gf-by">Final target by<input id="gf-by" type="date" value="${d.by}"></label>
  <label for="gf-stretch">Stretch date (optional)<input id="gf-stretch" type="date" value="${d.stretch||""}"></label></div>
  <div class="note" id="gf-prev" aria-live="polite"></div>
  <div class="row"><button class="solid" type="submit">Save goal</button><button class="ghost" type="button" id="gf-cancel">Cancel</button>${t?`<button class="x" type="button" id="gf-del" style="margin-left:auto">Remove goal</button>`:""}</div></form>`;
  goalPreview();
}
function readGoalForm(){
  const n=id=>Math.round(+$(id).value),t={start:n("gf-start"),final:n("gf-final"),step:n("gf-step"),from:$("gf-from").value,by:$("gf-by").value};
  const st=$("gf-stretch").value;if(st)t.stretch=st;
  let err="";
  if(!(t.start>=1))err="Set a starting target of at least 1.";
  else if(!(t.final>t.start))err="The final target needs to be higher than the start.";
  else if(!(t.step>=1))err="Raise the target by at least 1 at each step.";
  else if(!isDay(t.from)||!isDay(t.by))err="Pick a start date and a final date.";
  else if(t.by<=t.from)err="The final date needs to be after the start date.";
  else if(t.stretch&&!(t.stretch>t.from&&t.stretch<t.by))err="The stretch date should fall between the start and final dates.";
  else if(Math.ceil((t.final-t.start)/t.step)>60)err="That's more than 60 steps. Raise by a bigger amount each time.";
  return{t,err};
}
function goalPreview(){
  const el=$("gf-prev");if(!el)return;const{t,err}=readGoalForm();
  if(err){el.innerHTML=`<b style="color:var(--accent)">${esc(err)}</b>`;return}
  const L=ladder(t,t.by),line=x=>x.map(c=>`${c.v} ${fmtD(c.k)}`).join(" → ");
  el.innerHTML=`<b>Checkpoints:</b> ${line(L)}${t.stretch?`<br><b>Stretch:</b> ${line(ladder(t,t.stretch))}`:""}`;
}

document.addEventListener("submit",e=>{if(e.target.id!=="goalf")return;e.preventDefault();

let lastTiers=null,formOpen=false,confirmId=null;
function render(){
  const s=stats(),t=getDay(today());
  const l=lvlFor(s.xp),lo=l>1?need(l-1):0,hi=need(l);
  $("lvl").textContent=l;$("rank").textContent=RANKS[Math.min(RANKS.length-1,Math.floor((l-1)/2))];
  $("xpbar").style.width=Math.min(100,(s.xp-lo)/(hi-lo)*100)+"%";
  $("xptext").textContent=`${s.xp-lo} / ${hi-lo} XP to level ${l+1} · ${s.xp} total`;
  $("streak").textContent=s.streak;$("todayxp").textContent=dayXP(t,today());
  const tiers=allMedals().map(m=>tierOf(m,s));
  $("caught").textContent=tiers.reduce((a,b)=>a+b,0);
  $("todaylbl").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  const q=quests(t);
  $("quests").innerHTML=q.map(x=>`<div class="quest${x.ok?" done":""}" style="padding:4px 0"><span class="check">${x.ok?"✓":""}</span><span class="qt">${x.t}</span></div>`).join("");
  $("bonus").textContent=q.every(x=>x.ok)?"All five done today. +50 XP bonus earned!":`${q.filter(x=>x.ok).length} of 5 done. Clear all five for +50 XP.`;
  $("tabs").innerHTML=AREAS.map(a=>`<button class="tab" aria-pressed="${a===tab}" data-tab="${a}">${a}</button>`).join("");
  // extra controls per tab
  let ex="";
  if(tab==="Health"){
    const fw=s.first,cw=s.last;
    ex=`<div class="weight" style="margin-bottom:12px"><div><b>${fw??"–"}</b><span>start kg</span></div><div><b>${cw??"–"}</b><span>now kg</span></div><div><b>${fw!=null?s.tot.weight:"–"}</b><span>kg lost · aim 74–76</span></div></div>
    <div class="inputs" style="margin-bottom:12px">
      <div><span class="label">Beers today</span><div class="counter"><button class="mini" id="beerMinus" aria-label="One less beer">−</button><b>${t.beers||0}</b><button class="mini" id="beerPlus" aria-label="One more beer">+</button></div></div>
      <div><label class="label" for="steps">Steps today</label><div class="row"><input type="number" id="steps" inputmode="numeric" min="0" step="100" placeholder="8200" value="${t.steps||""}"><button class="mini" data-save="steps" style="width:auto;padding:0 12px">Save</button></div></div>
      <div><label class="label" for="weight">Weigh-in (kg)</label><div class="row"><input type="number" id="weight" inputmode="decimal" min="30" max="250" step="0.1" placeholder="86.0" value="${t.weight||""}"><button class="mini" data-save="weight" style="width:auto;padding:0 12px">Save</button></div></div>
      <div><label class="label" for="waist">Waist (cm)</label><div class="row"><input type="number" id="waist" inputmode="decimal" min="40" max="200" step="0.5" placeholder="100" value="${t.waist||""}"><button class="mini" data-save="waist" style="width:auto;padding:0 12px">Save</button></div></div>
    </div><span class="note" style="display:block;margin-bottom:12px">Beer-free days earn +30 XP and count toward Clear Head. 1–2 beers still earn +20.</span>`;
  }
  else if(tab==="Plan")ex=planHTML(s);
  $("extra").innerHTML=ex;
  const isPlan=tab==="Plan";
  $("pad").hidden=isPlan;$("mine").hidden=isPlan;$("medalpanel").hidden=isPlan;$("undo").hidden=isPlan;
  $("lh").textContent=isPlan?"Your plan":"Log it";
  const list=goals().filter(g=>g.a===tab&&(g.kind==="count"||g.kind==="check"));
  $("pad").innerHTML=list.map(g=>`<button class="btn${g.hero?" hero":""}${g.kind==="check"&&t[g.id]?" on":""}" data-g="${esc(g.id)}">${btnLabel(g,t)}</button>`).join("")+`<button class="btn add" id="newgoal">+ New ${tab.toLowerCase()} goal</button>`;
  const mine=custom.filter(g=>g.a===tab);
  $("mine").innerHTML=mine.length?`<div class="label" style="margin:4px 0 6px">Your goals</div>`+mine.map(g=>`<div class="mine"><span>${esc(g.name)}</span><button class="x${confirmId===g.id?" sure":""}" data-del="${esc(g.id)}">${confirmId===g.id?"Tap to confirm":"Remove"}</button></div>`).join(""):"";
  // medals
  const ms=medalsFor(tab);
  $("dexcount").textContent=ms.reduce((a,m)=>a+tierOf(m,s),0)+" of "+ms.length*4+" tiers";
  $("dex").innerHTML=ms.map(m=>{const ti=tierOf(m,s),v=s.tot[m.id]||0,next=m.g[ti],prev=ti?m.g[ti-1]:0;
    const pct=next?Math.max(0,Math.min(100,(v-prev)/(next-prev)*100)):100;
    return `<div class="medal t${ti}"><div class="disc" aria-hidden="true">${ti?TIERS[ti-1][0]:"–"}</div><div class="mtext"><b>${esc(m.medal)}</b><small>${ti?TIERS[ti-1]:"Not yet earned"}</small><div class="mbar"><i style="width:${pct}%"></i></div><span>${next?`${fmt(v,m)} / ${fmt(next,m)} ${esc(unitOf(m))} to ${TIERS[ti]}`:`Maxed · ${fmt(v,m)} ${esc(unitOf(m))}`}</span></div></div>`}).join("");
  // week
  let w="";const d=new Date();d.setDate(d.getDate()-6);
  for(let i=0;i<7;i++){const k=key(d),hit=days[k]&&(days[k].burpees||0)>=5;w+=`<div class="day${hit?" hit":""}${k===today()?" today":""}" title="${k}">${"SMTWTFS"[d.getDay()]}</div>`;d.setDate(d.getDate()+1)}
  $("week").innerHTML=w;
  const gmap=Object.fromEntries(goals().map(g=>[g.id,g]));
  const lg=(t.log||[]).slice().reverse();
  $("log").innerHTML=lg.length?lg.map(e=>{const g=gmap[e.k];let txt;
    if(e.k==="beers")txt=e.v>0?"+1 beer":"−1 beer";
    else if(e.k==="steps")txt=`Steps set to ${(+e.v).toLocaleString()}`;
    else if(e.k==="weight")txt=`Weighed in at ${e.v} kg`;
    else if(e.k==="waist")txt=`Waist ${e.v} cm`;
    else if(!g)txt="Removed goal";
    else if(g.kind==="check")txt=e.v?`${g.name} ✓`:`${g.name} unchecked`;
    else txt=`+${e.v} ${g.unit} · ${g.name}`;
    return `<div><span>${esc(txt)}</span><time>${e.t}</time></div>`}).join(""):`<p class="empty" style="margin:0">Nothing yet today. Tap +5 burpees to start your streak.</p>`;
  const tk=tiers.join();
  if(lastTiers!==null&&tk!==lastTiers){const p=lastTiers.split(",").map(Number),am=allMedals();const i=tiers.findIndex((v,j)=>v>(p[j]||0));if(i>=0)toast(`${TIERS[tiers[i]-1]} medal: ${am[i].medal}!`)}
  lastTiers=tk;
  if(formOpen)renderForm();else{$("formbox").hidden=true}
  renderTrends();
}
function renderForm(){
  const f=$("formbox");if(!f.hidden&&f.dataset.tab===tab)return;
  f.hidden=false;f.dataset.tab=tab;
  f.innerHTML=`<form class="new" id="newform"><b style="font-family:var(--display)">New ${tab} goal</b>
  <label for="ng-name">Goal name<input id="ng-name" required maxlength="40" placeholder="${tab==="Work"?"e.g. Contract proposal drafting":tab==="Growth"?"e.g. Meditation":tab==="Health"?"e.g. Glass of water":"e.g. Push-ups"}"></label>
  <div class="two"><label for="ng-kind">Type<select id="ng-kind"><option value="count">Count it up</option><option value="check">Once a day</option></select></label>
  <label for="ng-step">Per tap<input id="ng-step" type="number" min="1" value="1" inputmode="numeric"></label></div>
  <label for="ng-unit">Unit (for counts)<input id="ng-unit" maxlength="16" placeholder="e.g. min, reps, pages"></label>
  <div class="row"><button class="solid" type="submit">Add goal</button><button class="ghost" type="button" id="ng-cancel">Cancel</button></div>
  <span class="note">Medals unlock automatically: bronze, silver, gold and platinum.</span></form>`;
  $("ng-name").focus();
}
let tt;function toast(m){const el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2600)}
function commit(k,d,msg){const before=lvlFor(stats().xp);days[k]=d;render();store.saveDay(k,d);const after=lvlFor(stats().xp);if(after>before)msg=(msg?msg+" · ":"")+`Level up! You're level ${after}`;if(msg)toast(msg)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;formOpen=false;confirmId=null;goalFormOpen=false;$("goalform").hidden=true;try{localStorage.setItem("trailkin-tab",tab)}catch{}render();return}
  if(b.dataset.g){const g=goals().find(x=>x.id===b.dataset.g),k=today(),d=getDay(k);d.log=d.log||[];
    if(g.kind==="check"){const prev=d[g.id]||0;d[g.id]=prev?0:1;d.log.push({k:g.id,v:d[g.id],prev,t:now()});commit(k,d,prev?"":`+${g.xp} XP`)}
    else{const was=d[g.id]||0,tg=targets[g.id]?targetOn(targets[g.id],k):null,xp=Math.round(g.step*g.xp);d[g.id]=was+g.step;d.log.push({k:g.id,v:g.step,t:now()});
      commit(k,d,tg&&was<tg&&d[g.id]>=tg?`Daily target of ${tg} hit! +${xp+TARGET_XP} XP`:`+${xp} XP`)}
    return}
  if(b.dataset.save){const id=b.dataset.save,raw=+$(id).value;if(!raw||raw<0){toast(id==="weight"?"Enter your weight in kg":id==="waist"?"Enter your waist in cm":"Enter your steps");return}
    const v=id==="steps"?Math.round(raw):Math.round(raw*10)/10,k=today(),d=getDay(k);d.log=d.log||[];const prev=d[id]||0;d[id]=v;d.log.push({k:id,v,prev,t:now()});commit(k,d);toast(id==="weight"?`Weighed in: ${v} kg`:id==="waist"?`Waist saved: ${v} cm`:`Steps saved: ${v.toLocaleString()}`);return}
  if(b.id==="beerPlus"||b.id==="beerMinus"){const k=today(),d=getDay(k);d.log=d.log||[];const v=b.id==="beerPlus"?1:-1;if(v<0&&!d.beers)return;d.beers=(d.beers||0)+v;d.log.push({k:"beers",v,t:now()});commit(k,d);if(d.beers===3&&v>0)toast("That's 3. The 2-beer quest is gone for today.");return}
  if(b.id==="undo"){const k=today(),d=getDay(k),e2=(d.log||[]).pop();if(!e2){toast("Nothing to undo today");return}
    if(e2.prev!==undefined)d[e2.k]=e2.prev;else d[e2.k]=Math.max(0,(d[e2.k]||0)-e2.v);commit(k,d);toast("Undone");return}
  if(b.id==="goalnew"||b.id==="goaledit"){const g=selGoal();if(g)openGoalForm(g);return}
  if(b.id==="gf-cancel"){goalFormOpen=false;$("goalform").hidden=true;render();return}
  if(b.id==="gf-del"){if(!goalDelSure){goalDelSure=true;b.textContent="Tap to confirm";b.classList.add("sure");return}
    delete targets[$("goalform").dataset.g];saveTargets();goalFormOpen=false;$("goalform").hidden=true;render();toast("Goal removed");return}
  if(b.id==="newgoal"){formOpen=true;$("formbox").hidden=true;renderForm();return}
  if(b.id==="ng-cancel"){formOpen=false;$("formbox").hidden=true;return}
  if(b.dataset.del){const id=b.dataset.del;if(confirmId!==id){confirmId=id;render();return}
    custom=custom.filter(g=>g.id!==id);confirmId=null;render();store.saveGoals(custom);toast("Goal removed");return}
});
document.addEventListener("submit",e=>{if(e.target.id!=="newform")return;e.preventDefault();
  const name=$("ng-name").value.trim();if(!name)return;
  const kind=$("ng-kind").value,step=Math.max(1,Math.round(+$("ng-step").value||1)),unit=$("ng-unit").value.trim()||"times";
  const g={id:"c"+Date.now().toString(36),a:tab,name,kind,medal:name,du:kind==="check"?"days":unit};
  if(kind==="check"){g.xp=20;g.g=[3,15,45,120]}else{g.step=step;g.unit=unit;g.xp=Math.max(.2,Math.round(10/step*10)/10);g.g=[10,50,150,400].map(x=>x*step)}
  custom=custom.concat(g);formOpen=false;$("formbox").hidden=true;render();store.saveGoals(custom);toast(`Added: ${name}`)});

// storage: synced to the account when available, this browser otherwise
const LS="trailkin-days",LSG="trailkin-goals";
const lsLoad=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||f)}catch{return JSON.parse(f)}};
const lsSave=()=>{try{localStorage.setItem(LS,JSON.stringify(days));localStorage.setItem(LSG,JSON.stringify(custom))}catch{}};
days=lsLoad(LS,"{}");custom=lsLoad(LSG,"[]");
store={saveDay:lsSave,saveGoals:lsSave};
render();
(async()=>{
  try{
    const db=await claude.use("db"),user=await claude.use("user");
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const col=db.collection("data/users/"+id);
    const queue={},busy={};
    async function flush(k){if(busy[k])return;busy[k]=true;while(queue[k]){const d=queue[k];queue[k]=null;try{await col.doc(k).set(d)}catch{$("savenote").textContent="Couldn't sync to your account. Kept on this device."}}busy[k]=false}
    const put=(k,d)=>{lsSave();queue[k]=JSON.parse(JSON.stringify(d));flush(k)};
    let first=true;
    col.onSnapshot(snap=>{
      const remote={};let rg=null;
      snap.docs.forEach(x=>{if(!x.exists)return;if(x.id==="goals")rg=x.data().list||[];else if(isDay(x.id))remote[x.id]=x.data()});
      if(first){first=false;for(const k in days)if(!remote[k])put(k,days[k]);if(rg===null&&custom.length)put("goals",{list:custom})}
      for(const k in remote)if(!queue[k]&&!busy[k])days[k]=remote[k];
      if(rg!==null&&!queue.goals&&!busy.goals)custom=rg;
      lsSave();render();
    },()=>{});
    store={saveDay:put,saveGoals:list=>put("goals",{list})};
    $("savenote").textContent="Synced to your account, so it follows you across devices.";
  }catch{}
})();
</script>
