<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Superhuman Day</title>
<meta name="description" content="Superhuman Day: count your reps, log your wins and start each morning remembering what you've achieved. All data stays on your device.">
<meta name="theme-color" content="#F1F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Superhuman Day">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Superhuman Day</span></div>
  <div class="lvlchip" id="lvlChip"></div>
</header>

<main class="wrap" id="view" tabindex="-1">
  <noscript><p class="panel">Superhuman Day needs JavaScript turned on.</p></noscript>
</main>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" hidden></div>
<div class="breathe-overlay" id="breathOverlay" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<!-- Tapping this hidden switch gives a light haptic tick on iPhone (iOS 18+). -->
<label id="hapticLabel" class="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script src="js/app.js" defer></script>
</body>
</html>
